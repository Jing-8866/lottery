name: 定时抓取彩票开奖数据

on:
  schedule:
    # 每天 UTC 16:00 运行（北京时间 凌晨0:00）
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-crawl:
    runs-on: ubuntu-latest

    steps:
      - name: 检出 main 分支（含爬虫代码）
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml chardet

      - name: 恢复 data-auto 分支的历史数据到 data/
        run: |
          # main 分支因 .gitignore 不含 data/，历史数据只在 data-auto 分支
          git fetch origin data-auto 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/data-auto; then
            # data-auto 存在：用其 data/ 覆盖本地（先清空避免残留旧文件）
            rm -rf data
            git checkout origin/data-auto -- data || { echo "恢复 data-auto 历史数据失败"; exit 1; }
            echo "已恢复 data-auto 历史数据 ($(ls data | wc -l) 个文件)"
          else
            # 首次运行：data-auto 尚不存在，用空 data/ 让爬虫抓取初始数据
            mkdir -p data
            echo "data-auto 分支不存在，本次将抓取初始数据并创建 data-auto 分支"
          fi

      - name: 运行爬虫（与历史数据合并去重）
        run: python py/crawl.py

      - name: 仅推送 data/ 目录到 data-auto 分支
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          # 1. 备份生成的 JSON 数据到临时目录
          cp -r data /tmp/lottery-data

          # 2. 切换到 data-auto 分支（或新建孤立分支）
          git fetch origin data-auto 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/data-auto; then
            git checkout -B data-auto origin/data-auto
          else
            git checkout --orphan data-auto
          fi

          # 3. 清空工作目录（保留 .git），只保留 data/
          rm -rf ./* 2>/dev/null || true
          find . -maxdepth 1 -not -name '.git' -not -name '.' -exec rm -rf {} + 2>/dev/null || true
          mkdir -p data
          cp /tmp/lottery-data/*.json data/

          # 4. 提交并推送（仅 data/*.json）
          git add -f data/
          git diff --staged --quiet || git commit -m "Auto update lottery data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force origin data-auto